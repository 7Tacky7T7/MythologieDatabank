<!DOCTYPE html>
<html lang="nl" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gebruikersbeheer - Mythologie Databank</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Klassiek lettertype voor titels (past bij de oudheid/mythologie-sfeer) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="css/stijl.css" rel="stylesheet">
</head>
<body>

    <!-- ===================== NAVIGATIEBALK ===================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-myth sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="assets/logo.svg" alt="Logo" width="36" height="36">
                <span>Mythologie<span class="fw-light">Databank</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Overzicht</a></li>
                    <li class="nav-item js-ingelogd d-none navbar-text text-light">
                        <i class="bi bi-person-circle"></i> <span id="navNaam"></span>
                    </li>
                    <li class="nav-item js-ingelogd d-none">
                        <button id="navUitloggen" class="btn btn-outline-light btn-sm">Afmelden</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h1 class="mb-4"><i class="bi bi-people"></i> Gebruikersbeheer</h1>
        <div id="melding"></div>
        <div id="inhoud">
            <p class="text-muted">Hier keurt een administrator nieuwe accounts goed. Pas na
               goedkeuring zien gebruikers de bewerk-knoppen op de detailpagina's.</p>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Gebruiker</th>
                            <th>E-mail</th>
                            <th>Status</th>
                            <th class="text-end">Actie</th>
                        </tr>
                    </thead>
                    <tbody id="gebruikersBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
