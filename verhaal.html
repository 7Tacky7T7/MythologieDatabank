<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verhaal - Mythologie Databank</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/stijl.css" rel="stylesheet">
</head>
<body>

    <!-- ===================== NAVIGATIEBALK ===================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-myth sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="assets/logo.svg" alt="Logo" width="36" height="36">
                <span>Mythologie<span class="fw-light">Databank</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <li class="nav-item alleen-admin d-none">
                        <a class="nav-link" href="admin.html"><i class="bi bi-people"></i> Gebruikers</a>
                    </li>
                    <li class="nav-item js-uitgelogd">
                        <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#authModal">
                            Aanmelden / Registreren
                        </button>
                    </li>
                    <li class="nav-item js-ingelogd d-none navbar-text text-light">
                        <i class="bi bi-person-circle"></i> <span id="navNaam"></span>
                        <span id="navWachtBadge" class="badge text-bg-warning ms-1 d-none">wacht op goedkeuring</span>
                    </li>
                    <li class="nav-item js-ingelogd d-none">
                        <button id="navUitloggen" class="btn btn-outline-light btn-sm">Afmelden</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <a href="index.html" class="btn btn-link ps-0"><i class="bi bi-arrow-left"></i> Terug naar overzicht</a>
        <div id="melding"></div>

        <!-- Titel + potlood -->
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <h1 id="titel" class="mb-0">&nbsp;</h1>
            <button id="penTitel" class="pen alleen-bewerker d-none" title="Titel bewerken">
                <i class="bi bi-pencil-fill"></i>
            </button>
        </div>

        <!-- Tijdsperiode (eeuw) + potlood -->
        <p class="text-secondary mt-2 mb-3">
            <i class="bi bi-hourglass-split"></i> Tijdsperiode:
            <span id="eeuw"></span>
            <button id="penEeuw" class="pen alleen-bewerker d-none" title="Eeuw bewerken">
                <i class="bi bi-pencil-fill"></i>
            </button>
        </p>

        <div class="row g-4">
            <!-- Hoofdkolom: synopsis + leestekst -->
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-2">
                            <h2 class="h5 mb-0">Synopsis</h2>
                            <button id="penSynopsis" class="pen alleen-bewerker d-none" title="Synopsis bewerken">
                                <i class="bi bi-pencil-fill"></i>
                            </button>
                        </div>
                        <p id="synopsis" class="mb-0 mt-2"></p>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-2 mb-2">
                    <h2 class="h4 mb-0">Leestekst</h2>
                    <button id="penLeestekst" class="pen alleen-bewerker d-none" title="Leestekst bewerken">
                        <i class="bi bi-pencil-fill"></i>
                    </button>
                </div>
                <div id="leestekst" class="leestekst"></div>
            </div>

            <!-- Zijkolom: landen + wezens -->
            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h2 class="h5"><i class="bi bi-geo-alt"></i> Landen van herkomst</h2>
                        <div id="landen"></div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <h2 class="h5"><i class="bi bi-stars"></i> Wezens in dit verhaal</h2>
                        <div id="wezens" class="list-group list-group-flush"></div>
                    </div>
                </div>

                <button id="btnVerwijder" class="btn btn-outline-danger w-100 alleen-bewerker d-none">
                    <i class="bi bi-trash"></i> Verhaal verwijderen
                </button>
            </div>
        </div>
    </main>

    <!-- ===================== MODAL: aanmelden / registreren ===================== -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5">Welkom</h2>
                    <button class="btn-close" data-bs-dismiss="modal" aria-label="Sluiten"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs mb-3" role="tablist">
                        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabLogin" type="button">Aanmelden</button></li>
                        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabReg" type="button">Registreren</button></li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tabLogin">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label" for="loginNaam">Gebruikersnaam</label>
                                    <input id="loginNaam" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="loginWachtwoord">Wachtwoord</label>
                                    <input type="password" id="loginWachtwoord" class="form-control" required>
                                </div>
                                <div id="loginMelding"></div>
                                <button class="btn btn-primary w-100" type="submit">Aanmelden</button>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="tabReg">
                            <form id="regForm">
                                <div class="mb-3">
                                    <label class="form-label" for="regNaam">Gebruikersnaam</label>
                                    <input id="regNaam" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="regEmail">E-mail</label>
                                    <input type="email" id="regEmail" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="regWachtwoord">Wachtwoord (min. 6 tekens)</label>
                                    <input type="password" id="regWachtwoord" class="form-control" required>
                                </div>
                                <div id="regMelding"></div>
                                <button class="btn btn-success w-100" type="submit">Account aanmaken</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/verhaal.js"></script>
</body>
</html>
