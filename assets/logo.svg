<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mythologie Databank logo">
  <defs>
    <linearGradient id="achtergrond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2350"/>
      <stop offset="1" stop-color="#161229"/>
    </linearGradient>
    <linearGradient id="goud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#d4a02a"/>
