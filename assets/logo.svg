  </g>

  <!-- ogen -->
  <circle cx="25.5" cy="31" r="6.5" fill="#161229"/>
  <circle cx="38.5" cy="31" r="6.5" fill="#161229"/>
  <circle cx="25.5" cy="31" r="3" fill="#f6d365"/>
  <circle cx="38.5" cy="31" r="3" fill="#f6d365"/>

  <!-- snavel -->
